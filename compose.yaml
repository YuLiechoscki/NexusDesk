services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_local
      POSTGRES_DB: nexusdesk
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nexus_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexusdesk']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  nexus_data:
